[project]
name = "paper-copilot"
version = "0.8.0"
description = "Local, evidence-grounded question answering across research papers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "streamlit==1.63.0",
  "pymupdf==1.28.2",
  "rank-bm25==0.2.2",
  "numpy==2.5.2",
  "requests==2.34.2",
  "sentence-transformers==6.0.1",
]

[tool.setuptools]
py-modules = ["app"]

[tool.setuptools.packages.find]
include = ["src*"]
namespaces = true
